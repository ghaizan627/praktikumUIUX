<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
  </head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: darkgray;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      gap: 10px;
    }

    header {
        background-color: yellow;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: bold;
        border: 1px solid ;
    }

    nav {
        background-color: #76ff03;
        padding: 15px;
        text-align: left;
        font-weight: bold;
        border: 1px solid;
    }

    .main-content {
        display: flex;
        gap: 10px;
        flex: 1;
    }
    article {
        flex: 3;
        background-color: #d8b00f;
        padding: 15px;
        border: 1px solid #dd11bf;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    section {
        background-color: #c7ec50;
        padding: 15px;
        border: 1px solid #ffce56;
        flex: 1;
        display: flex;
        align-items: center;
    }

    aside {
        flex: 1;
        padding: 15px;
        background-color: #03ffff;
        border: 1px solid #0a9393;
    }

    footer {
        background-color: #ca9012;
        padding: 15px;
        text-align: left;
        font-weight: bold;
        border: 1px solid #ffce56;
    }
  </style>
  <body>
    <div class="wrapper">
      <header>
        <img src="logo.jpeg" alt="" width="50px" height="50px" />
        <p>ini website ku</p>
      </header>
      <nav>nav</nav>
      <div class="main-content">
        <article>
          article
          <section>sec</section>
          <section>sec</section>
          <section>sec</section>
        </article>
        <aside>aside</aside>
      </div>
      <footer></footer>
    </div>
  </body>
</html>
