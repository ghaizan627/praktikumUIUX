<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulir Pemesanan Pizza</title>
  </head>
  <style>
    h1,
    h3 {
      font-family: Arial, sans-serif;
    }
  </style>
  <body>
    <form action="http://blackgoosebistro.com/pizza.php" method="post">
      <h1>Black Goose Bistro | Pizza-on-Demand</h1>
      <p>
        Our 12" wood-fired pizzas are available for delivery. Build your <br />
        custom pizza and we'll deliver it within an hour. <br /><br />
        Your Information
      </p>
      <p>
        <label for="name">Name: </label>
        <input type="text" name="customername" id="name" required />
      </p>
      <p>
        <label for="address">Address: </label>
        <input type="text" name="address" id="address" required />
      </p>
      <p>
        <label for="phone">Telephone Number: </label>
        <input type="text" name="telephone" id="phone" required />
      </p>
      <p>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" required />
      </p>
      <p>
        <label for="instruction">Delivery Instructions: </label> <br />
        <textarea
          name="instructions"
          id="instruction"
          placeholder="No more than 400 characters long"
        ></textarea>
      </p>
      <h3>Design Your Dream Pizza</h3>
      <p>Pizza specs</p>
      <p>
        <label for="crust">Crust(Choose one):</label> <br />
        <input
          type="radio"
          name="crust"
          id="classic"
          value="Classic White"
          required
        />
        <label for="classic">Classic White</label> <br />
        <input
          type="radio"
          name="crust"
          id="multigrain"
          value="Multigrain"
          required
        />
        <label for="multigrain">Multigrain</label> <br />
        <input
          type="radio"
          name="crust"
          id="cheese"
          value="Cheese-stuffed crust"
          required
        />
        <label for="cheese">Cheese-stuffed crust</label> <br />
        <input
          type="radio"
          name="crust"
          id="gluten-free"
          value="Gluten-free"
          required
        />
        <label for="gluten-free">Gluten-free</label>
      </p>
      <p>
        <label for="toppings">Toppings (Choose as many as you want):</label>
        <br />
        <input
          type="checkbox"
          name="toppings[]"
          id="red-sauce"
          value="Red Sauce"
          checked
        />
        <label for="red-sauce">Red Sauce</label> <br />
        <input
          type="checkbox"
          name="toppings[]"
          id="white-sauce"
          value="White Sauce"
        />
        <label for="white-sauce">White Sauce</label> <br />
        <input
          type="checkbox"
          name="toppings[]"
          id="mozzarella-cheese"
          value="Mozzarella Cheese"
        />
        <label for="mozzarella-cheese">Mozzarella Cheese</label> <br />
        <input
          type="checkbox"
          name="toppings[]"
          id="pepperoni"
          value="Pepperoni"
        />
        <label for="pepperoni">Pepperoni</label> <br />
        <input
          type="checkbox"
          name="toppings[]"
          id="mushrooms"
          value="Mushrooms"
        />
        <label for="mushrooms">Mushrooms</label> <br />
        <input type="checkbox" name="toppings[]" id="peppers" value="Peppers" />
        <label for="peppers">Peppers</label> <br />
        <input
          type="checkbox"
          name="toppings[]"
          id="Anchovies"
          value="Anchovies"
        />
        <label for="Anchovies">Anchovies</label> <br />
      </p>
      <p>
        <label for="jumlah">Number:</label> <br />
        <select name="number" id="jumlah">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </p>
      <p>
        <input type="submit" value="Bring me a pizza!" />
        <input type="reset" value="Reset" />
      </p>
    </form>
  </body>
</html>
